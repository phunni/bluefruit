# yaml-language-server: $schema=https://schema.blue-build.org/module-stage-list-v1.json
modules:
  - type : dnf
    install:
      packages:
      #basic setup
      - screen
      - p7zip
      - unrar
      - cmake
      - meson
      - usbutils
      - fish
      - htop
      - btop
      - rsync
      - virt-manager
      - python3-llfuse
      - hwinfo
      - unzip
      - speedtest-cli
      - restic
      - fwupd
      - libappindicator-gtk3
      - zsh
      - easytag
      - libdvdcss
      - egl-wayland
      - evtest
      - qt6ct
      - fox-utils
      - zip
    # Hunnisett generic despktop apps
      - wmname
      - perf
      - fuse-sshfs
      - libsmbclient
      - wl-clipboard
      - gimp
      - handbrake



    #Java
  - type: dnf
    repos:
     files:
      -  https://packages.adoptium.net/artifactory/rpm/centos/$(uname -m)/adoptium.repo
     keys:
      - https://packages.adoptium.net/artifactory/api/gpg/key/public
    install:
      packages:
       - java-latest-openjdk
       - java-1.8.0-openjdk-devel
       - java-11-openjdk-devel
       - java-17-openjdk-devel
       - java-21-openjdk-devel
       - maven

  - type: dnf
    install:
      packages:
        - brscan5-1.8.0-0.x86_64.rpm

  - from-file: common/fonts.yml
