# yaml-language-server: $schema=https://schema.blue-build.org/module-stage-list-v1.json
modules:
  - type: files
    files:
      - source: keys/phunnimonkey-pub.asc
        destination: /opt/phunnimonkey-pub.asc
  - type: script
    snippets:
    - "echo '[multilib] \nServer = https://mirror.cj2.nl/archlinux/$repo/os/$arch' >> /etc/pacman.conf"
    - "echo '[redfruit] \nServer = https://pacman.redfruit.co.uk/' >> /etc/pacman.conf"
    - "pacman-key --add /opt/phunnimonkey-pub.asc"
    - "pacman-key --lsign-key 098593C2BD619DB55074837D90432592AFF15CCA"
  - type: pacman
    install:
      packages:
        #GPU
        - mesa
        - lib32-mesa
        - vulkan-radeon
        - vulkan-tools
        # Audio
        - pipewire
        - pipewire-audio
        - pipewire-alsa
        - pipewire-pulse
        - pipewire-jack
        - pipewire-libcamera
        - pipewire-v4l2
        - pipewire-ffado
        # Network
        - wget
        # Bluetooth
        - bluez
        - bluez-obex
        - bluez-mesh
        - bluez-utils
        # Font
        - noto-fonts
        - noto-fonts-cjk
        - noto-fonts-emoji
        - noto-fonts-extra
        # Archives GUI
        - xarchiver
        # AppImage thumbnailer dependencies
        - squashfuse
        - imagemagick
        # usb-storage-optimized-async dependencies
        - usbutils
        - bc
        # Debugging
        - strace
        - libva-utils
        - mesa-utils
        - vulkan-tools
        - clinfo
        - xdotool
        - joyutils
        # DNS resolver (replaces systemd-resolved)
        - unbound
        - avahi
        - nss-mdns
        # OOM prevention
        - jsoncpp
        # Provides setfattr for oomd-protect-self (user.oomd_avoid xattr tagging)
        - attr
        # Other
        - expac
        - dash
        - git
        # Virtual machines
        - virtualbox-guest-utils
        - qemu-guest-agent
        - spice-vdagent
        - phodav
        # Containers
        - distrobox
        # Desktop environment
        - obsidian-icon-theme
        - kvantum-qt5
        - kvantum
        - qt5ct
        - qt6ct
        - accountsservice
        - pavucontrol
        - xdg-user-dirs
        - gvfs
        - gvfs-mtp
        - zram-generator
        # CLI editor
        - nano

  - from-file: common/sddm-modules.yml
  - type: pacman
    install:
      packages:
        - screen
        - p7zip
        - unrar
        - cmake
        - meson
        - usbutils
        - fish
        - htop
        - btop
        - rsync
        - virt-manager
        - python-llfuse
        - hwinfo
        - unzip
        - speedtest-cli
        - restic
        - fwupd
        - libappindicator-gtk3
        - zsh
        - easytag
        - libdvdcss
        - egl-wayland
        - evtest
        - qt6ct
        - fox
        - zip
         # Hunnisett generic despktop apps
        - wmname
        - perf
        - sshfs
        - smbclient
        - wl-clipboard
        - gimp
        - handbrake





