# yaml-language-server: $schema=https://schema.blue-build.org/module-stage-list-v1.json
modules:
  - type: fonts
    fonts:
      nerd-fonts:
        - BitstreamVeraSansMono
        - DejaVuSansMono
        - JetBrainsMono
        - Inconsolata
        - Noto
        - Monoid
        - Mononoki
        - RobotoMono
        - DaddyTimeMono
        - DroidSansMono
        - ZedMono
        - Hermit
        - CodeNewRoman
      google-fonts:
        - Open Sans
        - Nunito
        - Noto Emoji
        - Noto Color Emoji
        - IBM Plex Mono
      url-fonts:
       - name: Font Awesome
         url:  https://github.com/FortAwesome/Font-Awesome/archive/7.3.1.tar.gz
