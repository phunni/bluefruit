modules:
    - type: pacman
      install:
        packages:
          - sddm
          - archlinux-themes-sddm
          - qt5-graphicaleffects
          - qt5-quickcontrols2
          - qt5-declarative
          - qt5-svg
          - qt6-svg
          - qt6-multimedia
          - qt6-declarative
          - gst-plugins-base
          - gst-plugins-base-libs
          - gst-plugins-good
          - gst-plugins-bad-libs
          - gst-plugins-ugly

          # Don't think I need or want the next two lines...
          #- kwallet
          #- pam-kwallet

    #- type: script
    #  scripts:
    #    - setsddmtheming.sh
    #    - setsddmtheming.sh

    - type: systemd
      system:
        enabled:
          - sddm-boot.service
          - sddm-service
