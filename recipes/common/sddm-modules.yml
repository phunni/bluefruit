modules:
    - type: dnf
      install:
        install-weak-deps: false
        packages:
          - sddm
          - sddm-themes
          - qt5-qtgraphicaleffects
          - qt5-qtquickcontrols2
          - qt5-qtsvg
          - qt6-qtsvg
          - qt6-qt5compat
          - qt6-qtmultimedia
          - gstreamer1-plugins-base
          - gstreamer1-plugins-good
          - gstreamer1-plugins-ugly-free
          - gstreamer1-plugins-bad-free
          # Don't think I need or want the next two lines...
          #- kwallet
          #- pam-kwallet

    - type: script
      scripts:
        - setsddmtheming.sh

    - type: systemd
      system:
        enabled:
          - sddm-boot.service
