modules:
    - type: dnf
      repos:
        copr:
          enable:
            - craftidore/wayblueorg-hyprland
      install:
        install-weak-deps: false
        packages:
        - kitty
        - alacritty
        - hyprland
        - waybar
        - xdg-desktop-portal-hyprland
        - hyprpaper
        - hyprlock
        - hypridle
        - hyprland-guiutils

    - type: script
      scripts:
        - removeunprofessionalwallpapers.sh
